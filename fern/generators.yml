api:
  specs:
    - openapi: ../openapi.yaml

groups:
  local:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.60.8
        output:
          location: local-file-system
          path: ../sdks/typescript

  sdk-go:
    generators:
      - name: fernapi/fern-go-sdk
        version: 0.31.0
        github:
          repository: grignolalouis/logidoc-sdk-go

  sdk-typescript:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.60.8
        github:
          repository: grignolalouis/logidoc-sdk-ts

  sdk-python:
    generators:
      - name: fernapi/fern-python-sdk
        version: 4.0.0
        github:
          repository: grignolalouis/logidoc-sdk-python
