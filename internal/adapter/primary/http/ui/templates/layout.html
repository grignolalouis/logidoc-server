<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>logidoc{{if .Title}} — {{.Title}}{{end}}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --background: hsl(240 10% 3.9%);
      --foreground: hsl(0 0% 98%);
      --card: hsl(240 10% 3.9%);
      --card-foreground: hsl(0 0% 98%);
      --muted: hsl(240 3.7% 15.9%);
      --muted-foreground: hsl(240 5% 64.9%);
      --secondary: hsl(240 3.7% 15.9%);
      --accent: hsl(240 3.7% 15.9%);
      --border: hsl(240 3.7% 15.9%);
      --input: hsl(240 3.7% 15.9%);
      --primary: hsl(0 0% 98%);
      --primary-foreground: hsl(240 5.9% 10%);
      --destructive: hsl(0 62.8% 30.6%);
      --ring: hsl(240 4.9% 83.9%);
      --radius: 0.5rem;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--background); color: var(--foreground); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration-line: underline; text-underline-offset: 4px; text-decoration-color: var(--muted-foreground); }
    a:hover { text-decoration-color: var(--foreground); }

    .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

    /* Header */
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
    .logo { font-size: 15px; font-weight: 600; letter-spacing: -0.025em; text-decoration: none; }
    nav { display: flex; gap: 24px; }
    nav a { font-size: 13px; color: var(--muted-foreground); text-decoration: none; transition: color 0.15s; }
    nav a:hover { color: var(--foreground); }

    /* Card */
    .card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); color: var(--card-foreground); }
    .card-header { padding: 24px 24px 0; }
    .card-content { padding: 24px; }
    .card-footer { padding: 0 24px 24px; display: flex; align-items: center; gap: 8px; }
    .card-title { font-size: 15px; font-weight: 600; letter-spacing: -0.025em; line-height: 1; }
    .card-description { font-size: 13px; color: var(--muted-foreground); margin-top: 4px; }

    /* Table */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th { text-align: left; padding: 10px 16px; font-size: 12px; font-weight: 500; color: var(--muted-foreground); border-bottom: 1px solid var(--border); }
    tbody td { padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tbody tr:last-child td { border-bottom: none; }

    /* Badge */
    .badge { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 9999px; font-size: 11px; font-weight: 500; white-space: nowrap; border: 1px solid transparent; }
    .badge-uploaded { background: hsl(38 92% 50% / 0.15); color: hsl(38 92% 50%); border-color: hsl(38 92% 50% / 0.2); }
    .badge-indexing { background: hsl(217 91% 60% / 0.15); color: hsl(217 91% 60%); border-color: hsl(217 91% 60% / 0.2); }
    .badge-ready { background: hsl(142 76% 36% / 0.15); color: hsl(142 71% 45%); border-color: hsl(142 76% 36% / 0.2); }
    .badge-error { background: hsl(0 84% 60% / 0.15); color: hsl(0 84% 60%); border-color: hsl(0 84% 60% / 0.2); }

    /* Button */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: calc(var(--radius) - 2px); font-size: 13px; font-weight: 500; white-space: nowrap; border: 1px solid var(--border); background: transparent; color: var(--foreground); cursor: pointer; transition: background 0.15s, border-color 0.15s; }
    .btn:hover { background: var(--accent); }
    .btn-primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
    .btn-primary:hover { background: hsl(0 0% 88%); border-color: hsl(0 0% 88%); }
    .btn-ghost { border-color: transparent; }
    .btn-ghost:hover { background: var(--accent); }
    .btn-destructive { color: hsl(0 84% 60%); border-color: hsl(0 62.8% 30.6%); }
    .btn-destructive:hover { background: hsl(0 62.8% 30.6% / 0.2); }
    .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }

    /* Upload zone */
    .upload-zone { border: 1px dashed var(--border); border-radius: var(--radius); padding: 40px 24px; text-align: center; cursor: pointer; transition: border-color 0.15s; }
    .upload-zone:hover, .upload-zone.dragover { border-color: var(--muted-foreground); }
    .upload-zone p { font-size: 13px; color: var(--muted-foreground); }
    .upload-zone .filename { color: var(--foreground); font-weight: 500; }

    /* TOC tree */
    .toc-tree, .toc-tree ul { list-style: none; }
    .toc-tree ul { padding-left: 20px; border-left: 1px solid var(--border); margin-left: 6px; }
    .toc-node { padding: 6px 0; }
    .toc-title { font-size: 13px; font-weight: 500; cursor: pointer; }
    .toc-title:hover { text-decoration: underline; text-underline-offset: 2px; }
    .toc-id { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; color: var(--muted-foreground); margin-left: 8px; }
    .toc-summary { display: block; font-size: 12px; color: var(--muted-foreground); margin-top: 1px; }
    .section-text { background: var(--muted); border-radius: calc(var(--radius) - 2px); padding: 12px; margin-top: 6px; font-size: 12px; font-family: ui-monospace, SFMono-Regular, monospace; line-height: 1.5; white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow-y: auto; display: none; }
    .section-text.open { display: block; }
    .toc-node.active > div > .toc-title { color: hsl(217 91% 60%); }

    /* Split view */
    .split-view { display: flex; gap: 16px; }
    .split-left { flex: 1; min-width: 0; overflow-y: auto; max-height: calc(100vh - 200px); }
    .split-right { flex: 1; min-width: 0; position: sticky; top: 16px; }
    .pdf-container { height: calc(100vh - 200px); }
    @media (max-width: 900px) {
      .split-view { flex-direction: column; }
      .split-right { position: static; }
      .pdf-container { height: 500px; }
    }

    /* Utilities */
    .text-muted { color: var(--muted-foreground); }
    .text-sm { font-size: 13px; }
    .text-xs { font-size: 12px; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, monospace; }
    .font-medium { font-weight: 500; }
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .mt-4 { margin-top: 16px; }
    .mb-4 { margin-bottom: 16px; }
    .gap-2 { gap: 8px; }
    .flex { display: flex; align-items: center; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; }
    .empty { text-align: center; padding: 64px 24px; }

    .separator { height: 1px; background: var(--border); margin: 24px 0; }

    /* HTMX */
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="/ui" class="logo">logidoc</a>
    </header>
    {{.Content}}
  </div>
</body>
</html>
