services:
  logidoc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
    ports:
      - "${HTTP_PORT:-7042}:${HTTP_PORT:-7042}"
      - "${MCP_PORT:-7043}:${MCP_PORT:-7043}"
    env_file:
      - .env.prod
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo:${MONGO_VERSION:-7}
    ports:
      - "${MONGO_PORT:-27042}:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
